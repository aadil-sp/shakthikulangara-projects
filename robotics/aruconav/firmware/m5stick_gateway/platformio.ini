[env:m5stick-c-plus2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.wchusbserial58570017951
monitor_port = /dev/cu.wchusbserial58570017951
board_build.flash_mode = dout
board_build.f_flash = 40000000L
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified @ ^0.1.16
    m5stack/M5GFX @ ^0.1.16
